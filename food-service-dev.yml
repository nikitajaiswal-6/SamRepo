server:
  port: 9097

spring:
  application:
    name: "food-service"
  datasource:
    url: jdbc:mysql://localhost:3306/microservicess
    username: Sam_spark
    password: java
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update   # create / update / validate / none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
management:
  endpoints:
    web:
      exposure:
        include: "*"

  info:
    env:
      enabled: true


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

info:
  app:
    name: "Food Service In Dev "
    description: "This is Food Service UnderDev"
    version: "1.0V"
